# Prism CI
#
# 环境要求：Xcode 27 / Swift 6.4。
# Xcode 26.6 的 Swift 6 并发检查会在 AetherEngine 7.44.0 的 codecpar 闭包捕获处报错。
# GitHub 的 `xcode-27` 预览镜像提供与本地已验证环境相同的 Xcode 27 工具链。
#
# 注意：本仓库的 xcodebuild 需要解析**本地** SPM 包（path: .），
# 因此不需要任何网络凭据；凭据助手已在 scripts/env.sh 里禁用，避免任何钥匙串交互。
#
# 参考：
#   https://github.com/maxim-lobanov/setup-xcode
#   https://github.com/actions/runner-images

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Bootstrap (XcodeGen + generate project)
        run: ./scripts/bootstrap.sh

      - name: Build (xcodebuild, Debug)
        run: ./scripts/build.sh

      - name: Verify app bundle
        run: test -d build/Build/Products/Debug/Prism.app

      - name: Test (swift test)
        run: ./scripts/test.sh

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/Logs/**
          if-no-files-found: ignore
          retention-days: 7
